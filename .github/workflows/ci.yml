name: CI

on:
  push:
    branches: [objc]
  pull_request:
    branches: [objc]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan
        run: gitleaks detect --no-banner --redact --config .gitleaks.toml --log-opts="${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '-1' }}"

  test:
    name: Build and test
    runs-on: macos-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen cocoapods xcbeautify
      - name: Generate project
        run: |
          cp Configs/Secrets.example.xcconfig Configs/Secrets.xcconfig
          xcodegen generate
          pod install
      - name: Test
        run: ./Scripts/ci-test.sh
